volumes:
  portainer_data:
    driver: local
    # Note: When NVMe storage is configured, this volume will be stored on the NVMe drive
    # via Docker's data-root configuration in /etc/docker/daemon.json
  homeassistant_data:
    driver: local
  pihole_data:
    driver: local
  pihole_dnsmasq:
    driver: local
  n8n_data:
    driver: local
  # WordPress volumes
  wordpress_data:
    driver: local
  wordpress_db:
    driver: local
  # OpenWebUI volume
  openwebui_data:
    driver: local
  # Wazuh volumes (uncomment when enabling Wazuh - set ENABLE_WAZUH=true in .env)
  # wazuh_api_configuration:
  #   driver: local
  # wazuh_etc:
