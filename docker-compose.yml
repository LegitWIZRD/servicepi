services:
  # Reverse Proxy - HTTP only
  nginx-proxy:
    # Using nginx:alpine with version tag for ARM64 compatibility
    # Alpine images are lightweight and well-suited for Raspberry Pi
    image: nginx:1.28.1-alpine
    container_name: servicepi-proxy
    ports:
      - "80:80"    # HTTP for web dashboard
      - "9000:9000" # HTTP for Portainer
      - "8080:8080" # HTTP for IoT API
      - "8123:8123" # HTTP for Home Assistant
      - "8053:8053" # HTTP for Pi-hole Admin
      - "5678:5678" # HTTP for N8N
      - "8081:8081" # HTTP for WordPress
      - "3000:3000" # HTTP for OpenWebUI
      # Uncomment the port below when enabling Wazuh (set ENABLE_WAZUH=true in .env)
      # - "8443:8443" # HTTP for Wazuh Dashboard
    volumes:
      - ./configs/nginx/proxy:/etc/nginx/conf.d
      - ./configs/web:/usr/share/nginx/html/web
    restart: unless-stopped
    networks:
      - servicepi-network
    depends_on:
      - web-backend
      - portainer
      - iot-service
      - homeassistant
      - pihole
      - n8n
      - wordpress
      - openwebui
      # Uncomment when enabling Wazuh (set ENABLE_WAZUH=true in .env)
      # - wazuh-dashboard

  # Web Backend (internal only)
  web-backend:
    # Using nginx:alpine with version tag for ARM64 compatibility
    image: nginx:1.28.1-alpine
    container_name: servicepi-web-backend
    volumes:
      - ./configs/nginx/backend:/etc/nginx/conf.d
      - ./configs/web:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - servicepi-network
    # No exposed ports - accessed via nginx-proxy

  # Container Management (Portainer)
  portainer:
    # Using specific version tag instead of :latest for reproducibility
    # Portainer CE 2.38.0 includes bug fixes, security updates, and improvements
    image: portainer/portainer-ce:2.38.0-alpine
    container_name: servicepi-portainer
    command: --host unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    networks:
      - servicepi-network
    # No exposed ports - accessed via nginx-proxy at :9000

  # IoT Service with API
  iot-service:
    build:
      context: ./configs/iot
      dockerfile: Dockerfile
    container_name: servicepi-iot
    volumes:
      - ./configs/iot:/app/config
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - API_PORT=8080
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80}
    # No exposed ports - accessed via nginx-proxy at :8080
    # Uncomment for GPIO access on Pi
    # privileged: true
    # devices:
    #   - /dev/gpiomem:/dev/gpiomem

  # Home Assistant
  homeassistant:
    # Using stable tag with specific version for reproducibility
    # Home Assistant 2026.1.3 includes bug fixes and improvements
    image: ghcr.io/home-assistant/home-assistant:2026.1.3
    container_name: servicepi-homeassistant
    volumes:
      - homeassistant_data:/config
      - ./configs/homeassistant/configuration.yaml:/config/configuration.yaml
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - TZ=America/New_York
    # No exposed ports - accessed via nginx-proxy at :8123

  # Pi-hole DNS Ad Blocker
  pihole:
    # Using specific version tag instead of :latest
    # Pi-hole 2025.11.1 includes important updates and fixes
    image: pihole/pihole:2025.11.1
    container_name: servicepi-pihole
    # Uncomment the ports below to enable network-wide DNS on your Pi
    # Note: Port 53 requires elevated privileges and may conflict with existing DNS services
    # ports:
    #   - "53:53/tcp"     # DNS TCP
    #   - "53:53/udp"     # DNS UDP
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
      - ./configs/pihole/adlists.list:/etc/pihole/adlists.list
      - ./configs/pihole/custom.list:/etc/pihole/custom.list
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - TZ=America/New_York
      - WEBPASSWORD=${PIHOLE_PASSWORD:-servicepi}
      - FTLCONF_LOCAL_IPV4=${PI_IP:-}
      - PIHOLE_DNS_=1.1.1.1;1.0.0.1
      - DNSMASQ_LISTENING=all
    # No exposed port for web interface - accessed via nginx-proxy at :8053
    # Pi-hole requires NET_ADMIN capability for DNS functionality
    # This is necessary and cannot be removed
    cap_add:
      - NET_ADMIN
    dns:
      - 127.0.0.1
      - 1.1.1.1

  # N8N Workflow Automation
  n8n:
    # Using specific version tag for reproducibility
    # n8n 2.4.8 is the latest stable LTS version (rolled back from 2.6.2 due to breaking changes)
    # Version 2.6.x had major release issues causing update failures
    image: n8nio/n8n:2.4.8
    container_name: servicepi-n8n
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
    # No exposed ports - accessed via nginx-proxy at :5678

  # WordPress - User-friendly dashboard for service links
  wordpress:
    # Using WordPress with PHP 8.2 and Apache
    image: wordpress:6.7-php8.2-apache
    container_name: servicepi-wordpress
    volumes:
      - wordpress_data:/var/www/html
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - WORDPRESS_DB_HOST=wordpress-db:3306
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:-wordpress}
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD_not_set_in_env_file}
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:-wordpress}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
    depends_on:
      - wordpress-db
    # No exposed ports - accessed via nginx-proxy at :8081

  # OpenWebUI - LLM Web Interface
  openwebui:
    # Using latest stable version of OpenWebUI
    image: ghcr.io/open-webui/open-webui:main
    container_name: servicepi-openwebui
    volumes:
      - openwebui_data:/app/backend/data
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET_KEY:-}
    # No exposed ports - accessed via nginx-proxy at :3000

  wordpress-db:
    # MySQL 8.0 database for WordPress (using latest 8.0.x for stability)
    image: mysql:8.0.45
    container_name: servicepi-wordpress-db
    volumes:
      - wordpress_db:/var/lib/mysql
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - MYSQL_ROOT_PASSWORD=${WORDPRESS_DB_ROOT_PASSWORD:?WORDPRESS_DB_ROOT_PASSWORD_not_set_in_env_file}
      - MYSQL_DATABASE=${WORDPRESS_DB_NAME:-wordpress}
      - MYSQL_USER=${WORDPRESS_DB_USER:-wordpress}
      - MYSQL_PASSWORD=${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD_not_set_in_env_file}
    # No exposed ports - internal database only

  # Wazuh Manager - Security monitoring and threat detection
  # To enable: Set ENABLE_WAZUH=true in .env and uncomment all Wazuh services below
