services:
  # Reverse Proxy - HTTP (local) and optional HTTPS (host Tailscale certs)
  nginx-proxy:
    # Use the default latest tag for the stack's current image versions
    # Alpine images are lightweight and well-suited for Raspberry Pi
    image: nginx:latest
    container_name: servicepi-proxy
    ports:
      - "80:80"    # HTTP for web dashboard (local traffic)
      - "443:443"  # Optional HTTPS for Tailscale traffic (activated by scripts/setup-tailscale-certs.sh)
      - "9000:9000" # HTTP for Portainer
      - "8080:8080" # HTTP for IoT API
      - "8053:8053" # HTTP for Pi-hole Admin
      - "5678:5678" # HTTP for N8N
      - "8081:8081" # HTTP for WordPress
      - "3000:3000" # HTTP for OpenWebUI
      - "8888:8888" # HTTP for SearXNG
    volumes:
      - ./configs/nginx/proxy:/etc/nginx/conf.d
      - ./configs/web:/usr/share/nginx/html/web
      - ./configs/nginx/certs:/etc/nginx/certs:ro  # SSL certificates for HTTPS (populated by setup-tailscale-certs.sh)
    restart: unless-stopped
    networks:
      - servicepi-network
    depends_on:
      - web-backend
      - portainer
      - iot-service
      - pihole
      - n8n
      - wordpress
      - openwebui
      - searxng

  # Web Backend (internal only)
  web-backend:
    # Use the default latest tag for the stack's current image versions
    image: nginx:latest
    container_name: servicepi-web-backend
    volumes:
      - ./configs/nginx/backend:/etc/nginx/conf.d
      - ./configs/web:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - servicepi-network
    # No exposed ports - accessed via nginx-proxy

  # Container Management (Portainer)
  portainer:
    # Use the default latest tag for the stack's current image versions
    image: portainer/portainer-ce:latest
    container_name: servicepi-portainer
    command: --host unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    networks:
      - servicepi-network
    # No exposed ports - accessed via nginx-proxy at :9000

  # IoT Service with API
  iot-service:
    build:
      context: ./configs/iot
      dockerfile: Dockerfile
    container_name: servicepi-iot
    volumes:
      - ./configs/iot:/app/config
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - API_PORT=8080
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80}
    # No exposed ports - accessed via nginx-proxy at :8080
    # Uncomment for GPIO access on Pi
    # privileged: true
    # devices:
    #   - /dev/gpiomem:/dev/gpiomem

  # Pi-hole DNS Ad Blocker
  pihole:
    # Use the default latest tag for the stack's current image versions
    image: pihole/pihole:latest
    container_name: servicepi-pihole
    # Uncomment the ports below to enable network-wide DNS on your Pi
    # Note: Port 53 requires elevated privileges and may conflict with existing DNS services
    # ports:
    #   - "53:53/tcp"     # DNS TCP
    #   - "53:53/udp"     # DNS UDP
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
      - ./configs/pihole/adlists.list:/etc/pihole/adlists.list
      - ./configs/pihole/custom.list:/etc/pihole/custom.list
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - TZ=${TZ:-America/New_York}
      - WEBPASSWORD=${PIHOLE_PASSWORD:-servicepi}
      - FTLCONF_LOCAL_IPV4=${PI_IP:-}
      - PIHOLE_DNS_=${PIHOLE_DNS:-1.1.1.1;1.0.0.1}
      - DNSMASQ_LISTENING=all
    # No exposed port for web interface - accessed via nginx-proxy at :8053
    # Pi-hole requires NET_ADMIN capability for DNS functionality
    # This is necessary and cannot be removed
    cap_add:
      - NET_ADMIN
    dns:
      - 127.0.0.1
      - 1.1.1.1

  # N8N Workflow Automation
  n8n:
    # Use the default latest tag for the stack's current image versions
    image: n8nio/n8n:latest
    container_name: servicepi-n8n
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${N8N_TIMEZONE:-America/New_York}
      - TZ=${N8N_TIMEZONE:-America/New_York}
    # No exposed ports - accessed via nginx-proxy at :5678

  # WordPress - User-friendly dashboard for service links
  wordpress:
    # Use the default latest tag for the stack's current image versions
    image: wordpress:latest
    container_name: servicepi-wordpress
    volumes:
      - wordpress_data:/var/www/html
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - WORDPRESS_DB_HOST=wordpress-db:3306
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:-wordpress}
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD_not_set_in_env_file}
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:-wordpress}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
    depends_on:
      - wordpress-db
    # No exposed ports - accessed via nginx-proxy at :8081

  # OpenWebUI - LLM Web Interface
  openwebui:
    # Use the default latest tag for the stack's current image versions
    image: ghcr.io/open-webui/open-webui:latest
    container_name: servicepi-openwebui
    volumes:
      - openwebui_data:/app/backend/data
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET_KEY:-}
      # SearXNG integration - enables web search from within OpenWebUI
      # Set SEARXNG_QUERY_URL in .env if you want to pre-configure SearXNG for OpenWebUI
      # Default points to the local SearXNG instance on the servicepi-network
      - SEARXNG_QUERY_URL=${SEARXNG_QUERY_URL:-http://searxng:8080/search?q=<query>&format=json}
      # Enable RAG web search using SearXNG so search works out of the box
      - ENABLE_RAG_WEB_SEARCH=${ENABLE_RAG_WEB_SEARCH:-True}
      - RAG_WEB_SEARCH_ENGINE=${RAG_WEB_SEARCH_ENGINE:-searxng}
    # No exposed ports - accessed via nginx-proxy at :3000

  # SearXNG - Privacy-respecting metasearch engine
  searxng:
    # Use the default latest tag for the stack's current image versions
    image: searxng/searxng:latest
    container_name: servicepi-searxng
    volumes:
      - ./configs/searxng:/etc/searxng
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-changeme-insecure-default}
      # Base URL is optional; if set, SearXNG uses it for generating absolute links
      # Example: http://192.168.1.100:8888/ or http://searxng.local:8888/
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-}
    # No exposed ports - accessed via nginx-proxy at :8888
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  wordpress-db:
    image: mysql:latest
    container_name: servicepi-wordpress-db
    volumes:
      - wordpress_db:/var/lib/mysql
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - MYSQL_ROOT_PASSWORD=${WORDPRESS_DB_ROOT_PASSWORD:?WORDPRESS_DB_ROOT_PASSWORD_not_set_in_env_file}
      - MYSQL_DATABASE=${WORDPRESS_DB_NAME:-wordpress}
      - MYSQL_USER=${WORDPRESS_DB_USER:-wordpress}
      - MYSQL_PASSWORD=${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD_not_set_in_env_file}
    # No exposed ports - internal database only

volumes:
  portainer_data:
    driver: local
    # Note: When NVMe storage is configured, this volume will be stored on the NVMe drive
    # via Docker's data-root configuration in /etc/docker/daemon.json
  pihole_data:
    driver: local
  pihole_dnsmasq:
    driver: local
  n8n_data:
    driver: local
  # WordPress volumes
  wordpress_data:
    driver: local
  wordpress_db:
    driver: local
  # OpenWebUI volume
  openwebui_data:
    driver: local
networks:
  servicepi-network:
    driver: bridge
