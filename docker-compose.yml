services:
  # Reverse Proxy - HTTP only
  nginx-proxy:
    # Using nginx:alpine with version tag for ARM64 compatibility
    # Alpine images are lightweight and well-suited for Raspberry Pi
    image: nginx:1.27.3-alpine
    container_name: servicepi-proxy
    ports:
      - "80:80"    # HTTP for web dashboard
      - "9000:9000" # HTTP for Portainer
      - "8080:8080" # HTTP for IoT API
      - "8123:8123" # HTTP for Home Assistant
      - "8053:8053" # HTTP for Pi-hole Admin
      - "5678:5678" # HTTP for N8N
    volumes:
      - ./configs/nginx/proxy:/etc/nginx/conf.d
      - ./configs/web:/usr/share/nginx/html/web
    restart: unless-stopped
    networks:
      - servicepi-network
    depends_on:
      - web-backend
      - portainer
      - iot-service
      - homeassistant
      - pihole
      - n8n

  # Web Backend (internal only)
  web-backend:
    # Using nginx:alpine with version tag for ARM64 compatibility
    image: nginx:1.27.3-alpine
    container_name: servicepi-web-backend
    volumes:
      - ./configs/nginx/backend:/etc/nginx/conf.d
      - ./configs/web:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - servicepi-network
    # No exposed ports - accessed via nginx-proxy

  # Container Management (Portainer)
  portainer:
    # Using specific version tag instead of :latest for reproducibility
    # Portainer CE 2.33.2 includes bug fixes and improvements
    image: portainer/portainer-ce:2.33.2-alpine
    container_name: servicepi-portainer
    command: --host unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    networks:
      - servicepi-network
    # No exposed ports - accessed via nginx-proxy at :9000

  # IoT Service with API
  iot-service:
    build:
      context: ./configs/iot
      dockerfile: Dockerfile
    container_name: servicepi-iot
    volumes:
      - ./configs/iot:/app/config
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - API_PORT=8080
    # No exposed ports - accessed via nginx-proxy at :8080
    # Uncomment for GPIO access on Pi
    # privileged: true
    # devices:
    #   - /dev/gpiomem:/dev/gpiomem

  # Home Assistant
  homeassistant:
    # Using stable tag with specific version for reproducibility
    # Home Assistant 2025.10 includes new features and improvements
    image: ghcr.io/home-assistant/home-assistant:2025.10.2
    container_name: servicepi-homeassistant
    volumes:
      - homeassistant_data:/config
      - ./configs/homeassistant/configuration.yaml:/config/configuration.yaml
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - TZ=America/New_York
    # No exposed ports - accessed via nginx-proxy at :8123

  # Pi-hole DNS Ad Blocker
  pihole:
    # Using specific version tag instead of :latest
    # Pi-hole 2025.08.0 includes important updates and fixes
    image: pihole/pihole:2025.08.0
    container_name: servicepi-pihole
    # Uncomment the ports below to enable network-wide DNS on your Pi
    # Note: Port 53 requires elevated privileges and may conflict with existing DNS services
    # ports:
    #   - "53:53/tcp"     # DNS TCP
    #   - "53:53/udp"     # DNS UDP
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
      - ./configs/pihole/adlists.list:/etc/pihole/adlists.list
      - ./configs/pihole/custom.list:/etc/pihole/custom.list
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - TZ=America/New_York
      - WEBPASSWORD=${PIHOLE_PASSWORD:-servicepi}
      - FTLCONF_LOCAL_IPV4=${PI_IP:-}
      - PIHOLE_DNS_=1.1.1.1;1.0.0.1
      - DNSMASQ_LISTENING=all
    # No exposed port for web interface - accessed via nginx-proxy at :8053
    # Pi-hole requires NET_ADMIN capability for DNS functionality
    # This is necessary and cannot be removed
    cap_add:
      - NET_ADMIN
    dns:
      - 127.0.0.1
      - 1.1.1.1

  # N8N Workflow Automation
  n8n:
    # Using specific version tag for reproducibility
    # n8n 1.114.3 includes workflow improvements and bug fixes
    image: n8nio/n8n:1.114.3
    container_name: servicepi-n8n
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - servicepi-network
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
    # No exposed ports - accessed via nginx-proxy at :5678

volumes:
  portainer_data:
    driver: local
    # Note: When NVMe storage is configured, this volume will be stored on the NVMe drive
    # via Docker's data-root configuration in /etc/docker/daemon.json
  homeassistant_data:
    driver: local
  pihole_data:
    driver: local
  pihole_dnsmasq:
    driver: local
  n8n_data:
    driver: local

networks:
  servicepi-network:
    driver: bridge