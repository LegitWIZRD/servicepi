# SearXNG - HTTP on port 8888
# Accessible via: http://IP:8888/ or http://searxng.local:8888/
server {
    listen 8888;
    server_name _ searxng.local;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # SearXNG proxy
    location / {
        proxy_pass http://searxng:8080/;

        # Essential headers for proper host identification
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Forward Origin and Referer
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;

        # Ensure cookies are properly forwarded
        proxy_cookie_path / /;
        proxy_cookie_domain off;

        # Increase timeouts for search operations.
        # SearXNG's per-engine outgoing timeout is 10 s and max is 15 s
        # (see configs/searxng/settings.yml outgoing section).
        # The proxy timeout must exceed those values so nginx does not
        # cut the connection before SearXNG finishes aggregating results.
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for real-time results
        proxy_buffering off;
    }
}

