# Main Web Dashboard - HTTP
# Accessible via: http://IP/ or http://servicepi.local/
server {
    listen 80;
    server_name _ servicepi.local;
    
    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Web Dashboard
    location / {
        proxy_pass http://web-backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://web-backend:80/health;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # API proxy to IoT service
    location /api/ {
        proxy_pass http://iot-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Map for WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Portainer - HTTP on port 9000
# Accessible via: http://IP:9000/ or http://portainer.local:9000/
server {
    listen 9000;
    server_name _ portainer.local;
    
    # Security headers - Use SAMEORIGIN for Portainer to allow embedding
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    
    # Portainer proxy
    location / {
        proxy_pass http://portainer:9000/;
        
        # Essential headers for proper host identification
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Critical: Forward Origin and Referer for CSRF validation
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        
        # Forward CSRF token header if present
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        
        # Ensure cookies are properly forwarded (don't modify them)
        proxy_cookie_path / /;
        proxy_cookie_domain off;
        
        # WebSocket support for Portainer real-time updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Increase timeouts for Portainer operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable proxy buffering for real-time communication
        proxy_buffering off;
    }
}

# IoT API - HTTP on port 8080
# Accessible via: http://IP:8080/ or http://iot.local:8080/
server {
    listen 8080;
    server_name _ iot.local;
    
    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # IoT API
    location / {
        proxy_pass http://iot-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # CORS headers for API access
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    }
}

# Home Assistant - HTTP on port 8123
# Accessible via: http://IP:8123/ or http://homeassistant.local:8123/
server {
    listen 8123;
    server_name _ homeassistant.local;
    
    # Security headers - Allow framing for Home Assistant UI components
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    
    # Home Assistant proxy
    location / {
        proxy_pass http://homeassistant:8123/;
        
        # Essential headers for proper host identification
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        
        # Critical: Forward Origin and Referer for Home Assistant CSRF validation
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        
        # Ensure cookies are properly forwarded
        proxy_cookie_path / /;
        proxy_cookie_domain off;
        
        # WebSocket support for Home Assistant real-time updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Increase timeouts for Home Assistant
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        
        # Disable buffering for real-time updates
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Support for large requests (Home Assistant config uploads)
        client_max_body_size 50M;
    }
}

