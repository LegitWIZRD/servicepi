# SearXNG Configuration for ServicePi
# This file configures the SearXNG instance
# For full documentation, see: https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

general:
  # Instance title shown in the browser and UI
  instance_title: "ServicePi Search"
  # Set to false to disable instance statistics
  enable_metrics: false

server:
  # Secret key for sessions - CHANGE THIS to a random string!
  # Generate with: openssl rand -hex 32
  secret_key: "${SEARXNG_SECRET_KEY}"
  # Listening interface and port (internal Docker network)
  bind_address: "0.0.0.0"
  port: 8080
  # Base URL - set this to your actual access URL for proper link generation
  # Example: http://192.168.1.100:8888/ or http://searxng.local:8888/
  base_url: false
  # Image proxy (proxies remote images through SearXNG for privacy)
  image_proxy: true
  # Disable the rate limiter - no Redis is available in this stack and the
  # limiter is only needed for public-facing instances
  limiter: false

outgoing:
  # Per-engine request timeout in seconds.
  # The SearXNG default (3-4 s) is too short for Raspberry Pi hardware and
  # typical internet latency, causing every engine to show "timeout".
  request_timeout: 10.0
  # Absolute upper bound a single engine request may take.
  max_request_timeout: 15.0
  # HTTP connection pool sizing – keeps connections alive for faster retries.
  pool_connections: 100
  pool_maxsize: 20
  # Enable HTTP/2 where supported for better multiplexing.
  enable_http2: true

ui:
  # Default theme
  default_theme: simple
  # Show/hide advanced search options by default
  default_locale: "en"
  # Number of results per page
  results_on_new_tab: false
  theme_args:
    simple_style: auto  # auto = follow system dark/light mode

search:
  # Safe search level: 0=off, 1=moderate, 2=strict
  safe_search: 0
  # Default search language
  default_lang: "en"
  # Number of results per page
  max_page: 0
  # Format of search results (json is needed for OpenWebUI integration)
  formats:
    - html
    - json

# Search engines
# use_default_settings: true (set at the top) already enables the full set of
# built-in SearXNG engines.  Listing engines here overrides that set, which
# previously reduced coverage to only 7 engines and caused most searches to
# return no results.  We rely on the full default set and only disable engines
# that are unsuitable for a private Raspberry Pi instance (require API keys,
# are unreliable, or duplicate results).
#
# To disable a specific engine, add it here with `disabled: true`, e.g.:
#   - name: google
#     disabled: true
#
# Full engine list: https://docs.searxng.org/user/configured_engines.html
