<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <!-- Outer dashed circle (navy segments) -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#1a2e5a" stroke-width="8"
    stroke-dasharray="40 18" stroke-linecap="round"/>
  <!-- Inner dashed circle (green segments) -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#5cb85c" stroke-width="5"
    stroke-dasharray="20 22" stroke-linecap="round"/>

  <!-- Raspberry body -->
  <ellipse cx="200" cy="230" rx="90" ry="95" fill="#8b1a3a"/>
  <!-- Raspberry drupelets (bumps) -->
  <circle cx="200" cy="215" r="20" fill="#a82050"/>
  <circle cx="170" cy="230" r="18" fill="#a82050"/>
  <circle cx="230" cy="230" r="18" fill="#a82050"/>
  <circle cx="188" cy="255" r="17" fill="#a82050"/>
  <circle cx="212" cy="255" r="17" fill="#a82050"/>
  <circle cx="200" cy="278" r="16" fill="#a82050"/>
  <circle cx="172" cy="270" r="15" fill="#7a1530"/>
  <circle cx="228" cy="270" r="15" fill="#7a1530"/>
  <!-- Drupelet highlight dots -->
  <circle cx="195" cy="210" r="5" fill="#c9365e" opacity="0.7"/>
  <circle cx="166" cy="226" r="4" fill="#c9365e" opacity="0.7"/>
  <circle cx="226" cy="226" r="4" fill="#c9365e" opacity="0.7"/>
  <circle cx="185" cy="250" r="4" fill="#c9365e" opacity="0.7"/>
  <circle cx="215" cy="250" r="4" fill="#c9365e" opacity="0.7"/>
  <circle cx="196" cy="273" r="4" fill="#c9365e" opacity="0.7"/>

  <!-- Leaves -->
  <ellipse cx="175" cy="148" rx="28" ry="14" fill="#4a9e4a" transform="rotate(-30 175 148)"/>
  <ellipse cx="225" cy="148" rx="28" ry="14" fill="#5cb85c" transform="rotate(30 225 148)"/>
  <ellipse cx="200" cy="142" rx="22" ry="12" fill="#4a9e4a"/>

  <!-- Stem / calyx -->
  <rect x="196" y="130" width="8" height="28" rx="4" fill="#3a7a3a"/>

  <!-- Pi symbol -->
  <text x="200" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="52"
    font-weight="bold" fill="#5cb85c" stroke="#ffffff" stroke-width="2">π</text>

  <!-- SERVICEPI text -->
  <text x="200" y="380" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
    font-size="46" font-weight="900" letter-spacing="2" fill="#1a2e5a">SERVICE</text>
  <text x="307" y="380" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
    font-size="46" font-weight="900" letter-spacing="2" fill="#5cb85c">PI</text>

  <!-- Subtitle -->
  <text x="200" y="420" text-anchor="middle" font-family="Arial, sans-serif"
    font-size="18" fill="#555555">Your Home Automation &amp; Network Hub</text>
</svg>
