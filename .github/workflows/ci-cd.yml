name: ServicePi CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_to_pi:
        description: 'Deploy to Raspberry Pi'
        required: false
        default: 'false'
        type: boolean

env:
  DOCKER_BUILDKIT: 1

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Validate Docker Compose
      run: |
        # Install docker-compose if not available
        if ! command -v docker-compose &> /dev/null; then
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.21.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
        fi
        
        # Validate docker-compose file
        docker-compose config
        
    - name: Validate shell scripts
      run: |
        # Check if shellcheck is available, install if not
        if ! command -v shellcheck &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y shellcheck
        fi
        
        # Validate shell scripts
        find scripts/ -name "*.sh" -exec shellcheck {} \;
        
    - name: Check configuration files
      run: |
        # Basic validation of config files
        echo "Checking configuration files..."
        
        # Check if nginx config is valid syntax
        if [ -f "configs/nginx/default.conf" ]; then
          echo "✓ Nginx config found"
        fi
        
        # Check if web files exist
        if [ -f "configs/web/index.html" ]; then
          echo "✓ Web content found"
        fi
        
        # Check if IoT config exists
        if [ -f "configs/iot/config.ini" ]; then
          echo "✓ IoT config found"
        fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  test-deployment:
    name: Test Deployment
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Install Docker Compose
      run: |
        # Install docker-compose if not available
        if ! command -v docker-compose &> /dev/null; then
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.21.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
        fi
        docker-compose --version
      
    - name: Test Docker Compose deployment
      run: |
        # Start services
        docker-compose up -d
        
        # Check if services are running
        echo "Checking service status..."
        docker-compose ps
        
        # Wait for nginx-proxy to be ready
        echo "Waiting for nginx-proxy to start..."
        timeout 60 bash -c 'until docker exec servicepi-proxy nginx -t 2>/dev/null; do sleep 2; done' || echo "Nginx config check timeout"
        
        # Wait for web-backend to be ready
        echo "Waiting for web-backend to start..."
        timeout 30 bash -c 'until docker exec servicepi-web-backend nginx -t 2>/dev/null; do sleep 2; done' || echo "Web backend check timeout"
        
        # Wait for IoT service to be ready
        echo "Waiting for IoT service to start..."
        timeout 60 bash -c 'until docker logs servicepi-iot 2>&1 | grep -q "Starting.*API"; do sleep 2; done' || echo "IoT service still starting"
        
        # Wait for Portainer to be ready - check internal port first
        echo "Waiting for Portainer to start (this may take up to 2 minutes)..."
        timeout 120 bash -c 'until docker logs servicepi-portainer 2>&1 | grep -q "Portainer started"; do sleep 3; done' || echo "Portainer initialization check timeout"
        
        # Additional wait for Portainer to be fully responsive
        echo "Allowing additional time for Portainer to be fully ready..."
        sleep 30
        
        # Show service status
        echo "=== Service Status ==="
        docker-compose ps
        
        # Show recent logs
        echo "=== Recent Logs ==="
        docker-compose logs --tail=20
        
        # Test HTTP web service
        echo "=== Testing web service ==="
        curl -f http://localhost/health || exit 1
        
        # Test HTTP IoT API
        echo "=== Testing IoT API ==="
        curl -f http://localhost:8080/health || exit 1
        curl -f http://localhost:8080/api/sensors || exit 1
        
        # Test inter-service communication
        echo "=== Testing inter-service communication ==="
        curl -f -X POST http://localhost:8080/api/system/communicate || exit 1
        
        # Test HTTP Portainer - with retries
        echo "=== Testing Portainer connection ==="
        MAX_RETRIES=5
        RETRY_COUNT=0
        until curl -f http://localhost:9000 || [ $RETRY_COUNT -eq $MAX_RETRIES ]; do
          RETRY_COUNT=$((RETRY_COUNT+1))
          echo "Portainer test attempt $RETRY_COUNT of $MAX_RETRIES failed, waiting 10 seconds..."
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            sleep 10
          fi
        done
        
        if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
          echo "Portainer test failed after $MAX_RETRIES attempts"
          echo "=== Portainer Logs ==="
          docker logs servicepi-portainer --tail=50
          echo "=== Nginx Proxy Logs ==="
          docker logs servicepi-proxy --tail=50
          exit 1
        fi
        
        echo "=== All tests passed ==="
        
        # Cleanup
        docker-compose down
        
  notify-deployment:
    name: Notify Pi for Deployment
    runs-on: ubuntu-latest
    needs: [validate, security-scan, test-deployment]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Create deployment notification
      run: |
        echo "🚀 ServicePi deployment ready!"
        echo "Repository: ${{ github.repository }}"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"
        echo ""
        echo "To deploy on your Raspberry Pi, run:"
        echo "sudo /opt/servicepi/scripts/update-pi.sh"
        echo ""
        echo "Or set up automatic deployment using a webhook or cron job."
        
    # Uncomment and configure if you want to automatically trigger Pi deployment
    # - name: Trigger Pi deployment
    #   if: github.event.inputs.deploy_to_pi == 'true' || github.event_name == 'push'
    #   run: |
    #     # Example: Send webhook to Pi or use SSH to trigger update
    #     # curl -X POST ${{ secrets.PI_WEBHOOK_URL }} \
    #     #   -H "Content-Type: application/json" \
    #     #   -d '{"action": "deploy", "commit": "${{ github.sha }}"}'