name: ServicePi CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_to_pi:
        description: 'Deploy to Raspberry Pi'
        required: false
        default: 'false'
        type: boolean

env:
  DOCKER_BUILDKIT: 1

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Validate Docker Compose
      run: |
        # Install docker-compose if not available
        if ! command -v docker-compose &> /dev/null; then
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
        fi
        
        # Create test .env file for validation
        cat > .env << 'EOF'
        # Test environment variables for CI/CD validation
        WORDPRESS_DB_USER=wordpress
        WORDPRESS_DB_PASSWORD=test_password_for_ci_validation_only
        WORDPRESS_DB_NAME=wordpress
        WORDPRESS_DB_ROOT_PASSWORD=test_root_password_for_ci_validation_only
        WORDPRESS_TABLE_PREFIX=wp_
        EOF
        
        # Validate docker-compose file
        docker-compose config
        
    - name: Check for unpinned Docker images
      run: |
        echo "Checking for unpinned Docker images (using :latest tag)..."
        
        # Check docker-compose.yml for :latest tags
        if grep -E '^\s+image:.*:latest' docker-compose.yml; then
          echo "❌ ERROR: Found unpinned Docker images using ':latest' tag"
          echo ""
          echo "For security and reproducibility, all Docker images should be pinned to specific versions."
          echo "Please update docker-compose.yml to use version tags instead of ':latest'"
          echo ""
          echo "Example:"
          echo "  ❌ image: nginx:latest"
          echo "  ✅ image: nginx:1.27.3-alpine"
          exit 1
        else
          echo "✅ All Docker images are pinned to specific versions"
        fi
        
    - name: Validate shell scripts
      run: |
        # Check if shellcheck is available, install if not
        if ! command -v shellcheck &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y shellcheck
        fi
        
        # Validate shell scripts
        find scripts/ -name "*.sh" -exec shellcheck {} \;
        
    - name: Check configuration files
      run: |
        # Basic validation of config files
        echo "Checking configuration files..."
        
        # Check if nginx config is valid syntax
        if [ -f "configs/nginx/default.conf" ]; then
          echo "✓ Nginx config found"
        fi
        
        # Check if web files exist
        if [ -f "configs/web/index.html" ]; then
          echo "✓ Web content found"
        fi
        
        # Check if IoT config exists
        if [ -f "configs/iot/config.ini" ]; then
          echo "✓ IoT config found"
        fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  test-deployment:
    name: Test Deployment
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Install Docker Compose
      run: |
        # Install docker-compose if not available
        if ! command -v docker-compose &> /dev/null; then
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
        fi
        docker-compose --version
      
    - name: Test Docker Compose deployment
      run: |
        # Create test .env file for deployment testing
        cat > .env << 'EOF'
        # Test environment variables for CI/CD
        WORDPRESS_DB_USER=wordpress
        WORDPRESS_DB_PASSWORD=test_password_for_ci_validation_only
        WORDPRESS_DB_NAME=wordpress
        WORDPRESS_DB_ROOT_PASSWORD=test_root_password_for_ci_validation_only
        WORDPRESS_TABLE_PREFIX=wp_
        EOF
        
        # Start services
        docker-compose up -d
        
        # Function to wait for service with retries
        wait_for_service() {
          local service_name=$1
          local test_command=$2
          local max_wait=${3:-60}
          local check_interval=${4:-2}
          
          echo "Waiting for $service_name to be ready (timeout: ${max_wait}s)..."
          local elapsed=0
          
          while [ $elapsed -lt $max_wait ]; do
            if eval "$test_command" 2>/dev/null; then
              echo "✓ $service_name is ready"
              return 0
            fi
            sleep $check_interval
            elapsed=$((elapsed + check_interval))
            echo "  Waiting for $service_name... (${elapsed}s/${max_wait}s)"
          done
          
          echo "✗ $service_name failed to become ready after ${max_wait}s"
          return 1
        }
        
        # Function to test HTTP endpoint with retries
        test_http_endpoint() {
          local endpoint=$1
          local description=$2
          local max_retries=${3:-10}
          local retry_delay=${4:-3}
          
          echo "Testing $description at $endpoint"
          
          for i in $(seq 1 $max_retries); do
            if curl -f -s -o /dev/null "$endpoint"; then
              echo "✓ $description - SUCCESS"
              return 0
            fi
            
            if [ $i -lt $max_retries ]; then
              echo "  Attempt $i/$max_retries failed, retrying in ${retry_delay}s..."
              sleep $retry_delay
            fi
          done
          
          echo "✗ $description - FAILED after $max_retries attempts"
          return 1
        }
        
        # Check if services are running
        echo "=== Initial Service Status ==="
        docker-compose ps
        
        # Wait for containers to be healthy
        echo ""
        echo "=== Waiting for Services to Start ==="
        
        wait_for_service "nginx-proxy" "docker exec servicepi-proxy nginx -t" 60 2 || true
        wait_for_service "web-backend" "docker exec servicepi-web-backend nginx -t" 30 2 || true
        wait_for_service "iot-service" "docker logs servicepi-iot 2>&1 | grep -q 'Starting.*API'" 90 3 || true
        wait_for_service "portainer" "docker logs servicepi-portainer 2>&1 | grep -q 'Portainer started'" 120 3 || true
        wait_for_service "pihole" "docker logs servicepi-pihole 2>&1 | grep -q 'FTL started'" 120 3 || true
        wait_for_service "n8n" "docker logs servicepi-n8n 2>&1 | grep -q 'Editor is now accessible'" 120 3 || true
        
        # Additional stabilization time
        echo ""
        echo "Allowing services to stabilize..."
        sleep 15
        
        # Show service status and logs
        echo ""
        echo "=== Service Status ==="
        docker-compose ps
        
        echo ""
        echo "=== Service Logs (last 30 lines each) ==="
        echo "--- Nginx Proxy ---"
        docker logs servicepi-proxy --tail=30 2>&1 || true
        echo ""
        echo "--- Web Backend ---"
        docker logs servicepi-web-backend --tail=30 2>&1 || true
        echo ""
        echo "--- IoT Service ---"
        docker logs servicepi-iot --tail=30 2>&1 || true
        echo ""
        echo "--- Portainer ---"
        docker logs servicepi-portainer --tail=30 2>&1 || true
        echo ""
        echo "--- Pi-hole ---"
        docker logs servicepi-pihole --tail=30 2>&1 || true
        echo ""
        echo "--- N8N ---"
        docker logs servicepi-n8n --tail=30 2>&1 || true
        
        # Test endpoints with retry logic
        echo ""
        echo "=== Testing HTTP Endpoints ==="
        
        # Test web service health endpoint
        test_http_endpoint "http://localhost/health" "Web service health check" 15 3 || {
          echo "=== Web Backend Logs ==="
          docker logs servicepi-web-backend --tail=50
          echo "=== Nginx Proxy Logs ==="
          docker logs servicepi-proxy --tail=50
          exit 1
        }
        
        # Test IoT API health endpoint
        test_http_endpoint "http://localhost:8080/health" "IoT API health check" 15 4 || {
          echo "=== IoT Service Logs ==="
          docker logs servicepi-iot --tail=50
          echo "=== Nginx Proxy Logs ==="
          docker logs servicepi-proxy --tail=50
          exit 1
        }
        
        # Test IoT API sensors endpoint
        test_http_endpoint "http://localhost:8080/api/sensors" "IoT API sensors endpoint" 15 4 || {
          echo "=== IoT Service Logs ==="
          docker logs servicepi-iot --tail=50
          exit 1
        }
        
        # Test inter-service communication
        echo "Testing inter-service communication"
        for i in $(seq 1 15); do
          if curl -f -s -X POST http://localhost:8080/api/system/communicate > /dev/null; then
            echo "✓ Inter-service communication - SUCCESS"
            break
          fi
          if [ $i -lt 15 ]; then
            echo "  Attempt $i/15 failed, retrying in 4s..."
            sleep 4
          else
            echo "✗ Inter-service communication - FAILED"
            docker logs servicepi-iot --tail=50
            exit 1
          fi
        done
        
        # Test Portainer endpoint
        test_http_endpoint "http://localhost:9000" "Portainer web interface" 20 5 || {
          echo "=== Portainer Logs ==="
          docker logs servicepi-portainer --tail=50
          echo "=== Nginx Proxy Logs ==="
          docker logs servicepi-proxy --tail=50
          exit 1
        }
        
        # Test Home Assistant endpoint
        test_http_endpoint "http://localhost:8123" "Home Assistant web interface" 30 6 || {
          echo "=== Home Assistant Logs ==="
          docker logs servicepi-homeassistant --tail=50
          echo "=== Nginx Proxy Logs ==="
          docker logs servicepi-proxy --tail=50
          exit 1
        }
        
        # Test Pi-hole admin endpoint
        test_http_endpoint "http://localhost:8053/admin" "Pi-hole admin interface" 30 6 || {
          echo "=== Pi-hole Logs ==="
          docker logs servicepi-pihole --tail=50
          echo "=== Nginx Proxy Logs ==="
          docker logs servicepi-proxy --tail=50
          exit 1
        }
        
        # Test N8N endpoint
        test_http_endpoint "http://localhost:5678" "N8N workflow automation interface" 30 6 || {
          echo "=== N8N Logs ==="
          docker logs servicepi-n8n --tail=50
          echo "=== Nginx Proxy Logs ==="
          docker logs servicepi-proxy --tail=50
          exit 1
        }
        
        # Test N8N secure cookie configuration
        echo ""
        echo "=== Testing N8N Secure Cookie Configuration ==="
        echo "Verifying N8N_SECURE_COOKIE is set to false..."
        if docker inspect servicepi-n8n | grep -q "N8N_SECURE_COOKIE=false"; then
          echo "✓ N8N_SECURE_COOKIE is properly configured for HTTP-only access"
        else
          echo "✗ N8N_SECURE_COOKIE is not set to false"
          docker inspect servicepi-n8n | grep N8N_SECURE_COOKIE || echo "N8N_SECURE_COOKIE not found"
          exit 1
        fi
        
        # Test Pi-hole DNS functionality
        echo ""
        echo "=== Testing Pi-hole DNS ==="
        # Note: DNS ports (53) are commented out by default to avoid conflicts
        # DNS functionality is tested through the admin interface instead
        echo "⊘ SKIP DNS resolution test (port 53 not exposed by default)"
        echo "  DNS ports can be enabled by uncommenting them in docker-compose.yml"
        
        # Test proxy header forwarding
        echo ""
        echo "=== Testing Proxy Header Forwarding ==="
        
        # Test that critical headers are forwarded to Portainer
        echo "Testing Portainer proxy headers..."
        PORTAINER_HEADERS=$(curl -v -s -o /dev/null \
          -H "Origin: http://testorigin.com" \
          -H "Referer: http://testreferer.com" \
          http://localhost:9000/ 2>&1 || true)
        
        if echo "$PORTAINER_HEADERS" | grep -q "< HTTP"; then
          echo "✓ Portainer proxy is forwarding requests"
        else
          echo "✗ Portainer proxy header forwarding test failed"
          docker logs servicepi-proxy --tail=30
          exit 1
        fi
        
        # Test that critical headers are forwarded to Home Assistant
        echo "Testing Home Assistant proxy headers..."
        HA_HEADERS=$(curl -v -s -o /dev/null \
          -H "Origin: http://testorigin.com" \
          -H "Referer: http://testreferer.com" \
          http://localhost:8123/ 2>&1 || true)
        
        if echo "$HA_HEADERS" | grep -q "< HTTP"; then
          echo "✓ Home Assistant proxy is forwarding requests"
        else
          echo "✗ Home Assistant proxy header forwarding test failed"
          docker logs servicepi-proxy --tail=30
          exit 1
        fi
        
        # Validate nginx configuration syntax inside container
        echo ""
        echo "=== Validating Nginx Configuration ==="
        if docker exec servicepi-proxy nginx -t 2>&1 | grep -q "successful"; then
          echo "✓ Nginx configuration syntax is valid"
        else
          echo "✗ Nginx configuration syntax validation failed"
          docker exec servicepi-proxy nginx -t
          exit 1
        fi
        
        echo ""
        echo "=== ✓ All tests passed ==="
        
        # Cleanup
        docker-compose down
        
  notify-deployment:
    name: Notify Pi for Deployment
    runs-on: ubuntu-latest
    permissions: {}
    needs: [validate, security-scan, test-deployment]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Create deployment notification
      run: |
        echo "🚀 ServicePi deployment ready!"
        echo "Repository: ${{ github.repository }}"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"
        echo ""
        echo "To deploy on your Raspberry Pi, run:"
        echo "sudo /opt/servicepi/scripts/update-pi.sh"
        echo ""
        echo "Or set up automatic deployment using a webhook or cron job."
        
    # Uncomment and configure if you want to automatically trigger Pi deployment
    # - name: Trigger Pi deployment
    #   if: github.event.inputs.deploy_to_pi == 'true' || github.event_name == 'push'
    #   run: |
    #     # Example: Send webhook to Pi or use SSH to trigger update
    #     # curl -X POST ${{ secrets.PI_WEBHOOK_URL }} \
    #     #   -H "Content-Type: application/json" \
    #     #   -d '{"action": "deploy", "commit": "${{ github.sha }}"}'